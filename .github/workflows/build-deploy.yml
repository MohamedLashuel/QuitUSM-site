name: build-deploy

run-name: ${{ github.actor }} building and deploying site

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
        npm install
        npm run build
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
    
