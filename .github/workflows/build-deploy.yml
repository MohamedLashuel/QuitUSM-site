name: build-deploy
run-name: ${{ github.actor }} building and deploying site
on: [push]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run start
